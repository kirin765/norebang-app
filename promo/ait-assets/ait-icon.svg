<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- 배경: 브랜드 보라, 불투명 정사각형 (모서리 없음) -->
  <rect width="600" height="600" fill="#5B2EFF"/>
  <rect width="600" height="600" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A4DFF"/>
      <stop offset="1" stop-color="#4A1FD8"/>
    </linearGradient>
  </defs>

  <!-- 마이크: 캡슐 + 거치대 -->
  <g transform="translate(300,300)">
    <!-- 마이크 캡슐 -->
    <rect x="-52" y="-150" width="104" height="196" rx="52" fill="#FFFFFF"/>
    <!-- 캡슐 음영 -->
    <rect x="-52" y="-150" width="104" height="96" rx="48" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-28" y="-116" width="16" height="128" rx="8" fill="#5B2EFF" opacity="0.55"/>
    <!-- 거치대 아치 -->
    <path d="M -96 56 a 96 96 0 0 0 192 0" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
    <!-- 받침 -->
    <rect x="-60" y="150" width="120" height="18" rx="9" fill="#FFFFFF"/>
  </g>
</svg>