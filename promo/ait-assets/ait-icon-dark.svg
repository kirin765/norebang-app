<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- 다크 모드 로고: 어두운 배경, 밝은 요소 -->
  <rect width="600" height="600" fill="#14101F"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241B3E"/>
      <stop offset="1" stop-color="#0D0A16"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5B2EFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5B2EFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#g)"/>
  <rect width="600" height="600" fill="url(#halo)"/>

  <!-- 마이크: 연보라 아웃라인 -->
  <g transform="translate(300,300)">
    <rect x="-52" y="-150" width="104" height="196" rx="52" fill="none" stroke="#9B7BFF" stroke-width="14"/>
    <rect x="-27" y="-122" width="15" height="122" rx="7.5" fill="#9B7BFF" opacity="0.6"/>
    <path d="M -96 56 a 96 96 0 0 0 192 0" fill="none" stroke="#9B7BFF" stroke-width="20" stroke-linecap="round"/>
    <rect x="-60" y="150" width="120" height="16" rx="8" fill="#9B7BFF"/>
  </g>
</svg>