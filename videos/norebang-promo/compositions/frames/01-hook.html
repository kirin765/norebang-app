<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata for the source file only; the runtime clones <template> contents -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Pretendard";
          font-weight: 500;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2");
        }
        @font-face {
          font-family: "Pretendard";
          font-weight: 700;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2");
        }
        @font-face {
          font-family: "Pretendard";
          font-weight: 800;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2");
        }
        @font-face {
          font-family: "Pretendard";
          font-weight: 900;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Pretendard-Black.woff2") format("woff2");
        }

        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: transparent;
          font-family: "Pretendard", sans-serif;
          -webkit-font-smoothing: antialiased;
        }

        /* --- Ground (full-bleed canvas + faint corner dot-grid) --- */
        [id="01-hook-ground"] {
          position: absolute;
          inset: 0;
          background-color: #fcfbff;
        }
        [class~="01-hook-dots"] {
          position: absolute;
          width: 440px;
          height: 440px;
          background-image: radial-gradient(
            circle,
            rgba(26, 21, 38, 0.06) 1.2px,
            transparent 1.6px
          );
          background-size: 24px 24px;
        }
        [id="01-hook-dots-tl"] {
          top: 0;
          left: 0;
        }
        [id="01-hook-dots-tr"] {
          top: 0;
          right: 0;
        }
        [id="01-hook-dots-bl"] {
          bottom: 0;
          left: 0;
        }
        [id="01-hook-dots-br"] {
          bottom: 0;
          right: 0;
        }

        /* --- Content stage --- */
        [id="01-hook-content"] {
          position: absolute;
          inset: 0;
        }

        /* label-pill */
        [id="01-hook-pillrow"] {
          position: absolute;
          top: 300px;
          left: 0;
          right: 0;
          text-align: center;
        }
        [id="01-hook-pill"] {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 14px 36px;
          border: 4px solid #1a1526;
          border-radius: 9999px;
          background: #fcfbff;
          box-shadow: 4px 4px 0 #1a1526;
          font-weight: 800;
          font-size: 42px;
          letter-spacing: -0.01em;
          color: #1a1526;
        }

        /* headline */
        [id="01-hook-head"] {
          position: absolute;
          top: 600px;
          left: 0;
          right: 0;
          text-align: center;
        }
        [id="01-hook-line1"] {
          display: flex;
          justify-content: center;
          align-items: flex-end;
          gap: 26px;
        }
        [id="01-hook-line2"] {
          display: flex;
          justify-content: center;
          align-items: baseline;
          margin-top: 6px;
        }
        [class~="01-hook-w"] {
          display: inline-block;
          font-weight: 900;
          font-size: 150px;
          line-height: 0.95;
          letter-spacing: -0.02em;
          color: #1a1526;
        }
        [id="01-hook-numwrap"] {
          position: relative;
          display: inline-flex;
        }
        [id="01-hook-hl"] {
          position: absolute;
          left: -8px;
          right: -8px;
          bottom: 20px;
          height: 24px;
          background: #5b2eff;
          z-index: 0;
        }
        [id="01-hook-num"] {
          position: relative;
          z-index: 1;
          display: inline-block;
          font-weight: 900;
          font-size: 194px;
          line-height: 0.9;
          letter-spacing: -0.02em;
          color: #5b2eff;
        }
        [class~="01-hook-w2"] {
          display: inline-block;
          font-weight: 900;
          font-size: 150px;
          line-height: 0.95;
          letter-spacing: -0.02em;
          color: #1a1526;
        }
        [id="01-hook-q"] {
          display: inline-block;
          font-weight: 900;
          font-size: 150px;
          line-height: 0.95;
          color: #1a1526;
        }

        /* sub-line */
        [id="01-hook-sub"] {
          position: absolute;
          top: 1160px;
          left: 0;
          right: 0;
          text-align: center;
          font-weight: 700;
          font-size: 48px;
          letter-spacing: -0.01em;
          color: #8a83a0;
        }
      </style>

      <div
        id="root"
        data-composition-id="01-hook"
        data-start="0"
        data-width="1080"
        data-height="1920"
        data-duration="3.3"
      >
        <!-- Ground: full-duration full-bleed canvas + faint corner dot-grid -->
        <div
          id="01-hook-ground"
          class="clip"
          data-start="0"
          data-duration="3.3"
          data-track-index="0"
        >
          <div id="01-hook-dots-tl" class="01-hook-dots"></div>
          <div id="01-hook-dots-tr" class="01-hook-dots"></div>
          <div id="01-hook-dots-bl" class="01-hook-dots"></div>
          <div id="01-hook-dots-br" class="01-hook-dots"></div>
        </div>

        <!-- Content -->
        <div
          id="01-hook-content"
          class="clip"
          data-start="0"
          data-duration="3.3"
          data-track-index="1"
        >
          <div id="01-hook-pillrow">
            <span id="01-hook-pill">🎤 노래방에서</span>
          </div>

          <div id="01-hook-head">
            <div id="01-hook-line1">
              <span class="01-hook-w" id="01-hook-w-i">이</span>
              <span class="01-hook-w" id="01-hook-w-gok">곡</span>
              <span id="01-hook-numwrap">
                <span id="01-hook-hl"></span>
                <span id="01-hook-num">번호</span>
              </span>
            </div>
            <div id="01-hook-line2">
              <span class="01-hook-w2" id="01-hook-rest">뭐였지</span>
              <span id="01-hook-q">?</span>
            </div>
          </div>

          <div id="01-hook-sub">리모컨 앞에서 또 멈칫…</div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // One tempo grid — every entrance reads its onset off this beat array.
        const PULSE = 0.3;
        const BEATS = [PULSE * 0.4, PULSE * 3.1, PULSE * 6.3]; // ≈ 0.12, 0.93, 1.89

        // Scene 1 — label-pill spring-pops (tilt baked into the tween, no CSS transform)
        tl.fromTo(
          '[id="01-hook-pill"]',
          { scale: 0.3, opacity: 0, rotation: -14 },
          { scale: 1, opacity: 1, rotation: -2, duration: 0.5, ease: "back.out(2.2)" },
          BEATS[0],
        );

        // Scene 1 — "이 곡" scale-slams in (blur→sharp)
        tl.fromTo(
          '[id="01-hook-w-i"]',
          { scale: 1.6, opacity: 0, filter: "blur(14px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
          BEATS[0] + 0.04,
        );
        tl.fromTo(
          '[id="01-hook-w-gok"]',
          { scale: 1.6, opacity: 0, filter: "blur(14px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
          BEATS[0] + 0.22,
        );

        // Scene 2 — "번호" snaps up from below (accent purple), distinct axis + ease
        tl.fromTo(
          '[id="01-hook-num"]',
          { y: 120, scale: 1.35, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" },
          BEATS[1] + 0.02,
        );

        // Scene 2 — tilted highlight bar sweeps in under 번호 (all-transform tween on the bar)
        tl.fromTo(
          '[id="01-hook-hl"]',
          { scaleX: 0, rotation: -2, transformOrigin: "left center" },
          { scaleX: 1, rotation: -2, transformOrigin: "left center", duration: 0.45, ease: "power3.out" },
          BEATS[1] + 0.16,
        );

        // Scene 2 — remainder "뭐였지?" rises + de-rotates to complete the line
        tl.fromTo(
          '[id="01-hook-line2"]',
          { y: 90, rotation: 6, opacity: 0 },
          { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "circ.out" },
          BEATS[1] + 0.3,
        );

        // Scene 3 — gray sub-line fades up
        tl.fromTo(
          '[id="01-hook-sub"]',
          { y: 28, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
          BEATS[2] + 0.02,
        );

        // Scene 3 — "?" micro-wobble, settles back to rest before the poster frame (2.2s)
        tl.to(
          '[id="01-hook-q"]',
          {
            rotation: -8,
            duration: 0.06,
            yoyo: true,
            repeat: 3,
            ease: "sine.inOut",
            transformOrigin: "bottom center",
          },
          BEATS[2] + 0.05,
        );

        window.__timelines["01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
