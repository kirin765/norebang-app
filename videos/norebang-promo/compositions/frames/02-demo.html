      </style>

      <div
        id="root"
        data-composition-id="02-demo"
        data-start="0"
        data-width="1080"
        data-height="1920"
        data-duration="4.7"
      >
        <!-- full-bleed ground (background layer) -->
        <div
          class="clip 02-demo-ground"
          id="02-demo-ground"
          data-start="0"
          data-duration="4.7"
          data-track-index="0"
        >
          <div class="02-demo-dots tl"></div>
          <div class="02-demo-dots br"></div>
        </div>

        <!-- timed content layer -->
        <div
          class="clip 02-demo-stage"
          id="02-demo-stage"
          data-start="0"
          data-duration="4.7"
          data-track-index="1"
        >
          <!-- phone hero -->
          <div class="02-demo-phone" id="02-demo-phone">
            <div class="02-demo-screen">
              <div class="02-demo-header">🎤 노래방 번호검색</div>

              <div class="02-demo-search">
                <span class="02-demo-glyph">🔍</span>
                <span class="02-demo-search-text">
                  <span class="02-demo-placeholder" id="02-demo-placeholder"
                    >곡명 또는 가수명 검색</span
                  >
                  <span class="02-demo-typed" id="02-demo-typed"></span>
                  <span class="02-demo-caret" id="02-demo-caret"></span>
                </span>
              </div>

              <div class="02-demo-chips">
                <span class="02-demo-chip">전체</span>
                <span class="02-demo-chip sel">TJ</span>
                <span class="02-demo-chip">금영</span>
              </div>

              <div class="02-demo-results">
                <div class="02-demo-row" id="02-demo-row0">
                  <span class="02-demo-badge tj">TJ 47590</span>
                  <span class="02-demo-meta">
                    <span class="02-demo-title">좋은 날</span>
                    <span class="02-demo-artist">아이유</span>
                  </span>
                  <span class="02-demo-heart">
                    <svg id="02-demo-heart-line" viewBox="0 0 24 24" fill="none">
                      <path
                        d="M12 20.5S3.5 15.2 3.5 8.9C3.5 6.1 5.6 4.2 8 4.2c1.7 0 3 .9 4 2.4 1-1.5 2.3-2.4 4-2.4 2.4 0 4.5 1.9 4.5 4.7 0 6.3-8.5 11.6-8.5 11.6z"

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const TOTAL = 4.2;

        const byId = (id) => document.getElementById(id);
        const phone = byId("02-demo-phone");
        const pill = byId("02-demo-pill");
        const star = byId("02-demo-star");
        const heartFill = byId("02-demo-heart-fill");
        const heartLine = byId("02-demo-heart-line");
        const row0 = byId("02-demo-row0");
        const rows = [row0, byId("02-demo-row1"), byId("02-demo-row2")];
        const typedEl = byId("02-demo-typed");
        const placeholderEl = byId("02-demo-placeholder");
        const caretEl = byId("02-demo-caret");

        // ---- deferred elements: hide at t=0 ----
        tl.set(pill, { scale: 0, opacity: 0, rotation: 6 }, 0);
        tl.set(star, { scale: 0, opacity: 0, rotation: 10 }, 0);
        tl.set(heartFill, { scale: 0, opacity: 0 }, 0);
        tl.set(rows, { opacity: 0, y: 32, scale: 0.96 }, 0);

        // ---- Scene 1: phone springs up from below, settles to +1.5deg ----
        tl.fromTo(
          phone,
          { y: 380, scale: 0.9, opacity: 0, rotation: 0 },
          { y: 0, scale: 1, opacity: 1, rotation: 1.5, duration: 0.72, ease: "back.out(1.3)" },
          0,
        );

        // ---- Scene 2: typing "아이유" (discrete-text-sequence) ----
        const SEQUENCE = [
          { t: 0.0, text: "" },
          { t: 0.9, text: "아" },
          { t: 1.2, text: "아이" },
          { t: 1.55, text: "아이유" },
        ];
        function textAt(time) {
          for (let i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
          }
          return "";
        }
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: TOTAL,
            duration: TOTAL,
            ease: "none",
            onUpdate: () => {
              const txt = textAt(driver.t);
              typedEl.textContent = txt;
              placeholderEl.style.opacity = txt.length ? "0" : "1";
            },
          },
          0,
        );

        // caret blink — deterministic sin (~6 cycles across the composition)
        const blink = { p: 0 };
        tl.to(
          blink,
          {
            p: Math.PI * 2 * 6,
            duration: TOTAL,
            ease: "none",
            onUpdate: () => {
              caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
            },
          },
          0,
        );

        // label-pill "3초면 끝" pops top-left near the phone
        tl.fromTo(
          pill,
          { scale: 0, opacity: 0, rotation: 6 },
          { scale: 1, opacity: 1, rotation: -3, duration: 0.5, ease: "back.out(1.6)" },
          1.0,
        );

        // ---- Scene 3: result rows cascade top -> bottom ----
        rows.forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0, y: 32, scale: 0.96 },
            { opacity: 1, y: 0, scale: 1, duration: 0.52, ease: "power3.out" },
            1.85 + i * 0.28,
          );
        });

        // ---- Scene 4: first row heart gray -> filled red (press-pop) + highlight + star ----
        tl.to(heartLine, { opacity: 0, duration: 0.22, ease: "power1.in" }, 3.35);
        tl.fromTo(
          heartFill,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.44, ease: "back.out(2.4)" },
          3.35,
        );
        tl.to(
          row0,
          { backgroundColor: "rgba(229,72,77,0.09)", duration: 0.4, ease: "power2.out" },
          3.3,
        );

        // tap star burst beside the phone
        tl.fromTo(
          star,
          { scale: 0, opacity: 0, rotation: 10 },
          { scale: 1, opacity: 1, rotation: -8, duration: 0.5, ease: "back.out(1.7)" },
          3.5,
        );

        window.__timelines["02-demo"] = tl;
      </script>
